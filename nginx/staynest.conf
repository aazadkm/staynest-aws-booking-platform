# StayNest Nginx site config
# Install to /etc/nginx/sites-available/staynest and symlink into sites-enabled

server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.html;

    # Admin dashboard — must come before the generic location block,
    # otherwise Nginx's try_files looks for a literal file named "admin"
    # (no extension) and returns 404.
    location = /admin {
        try_files /admin.html =404;
    }

    # Booking API — proxy to the Flask backend running on port 5000
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Static frontend
    location / {
        try_files $uri $uri/ =404;
    }
}
